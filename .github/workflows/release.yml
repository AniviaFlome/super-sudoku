name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK + Android SDK
        uses: ./.github/actions/setup

      - name: Check tag matches versionName
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DECLARED="$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\([^"]*\)".*/\1/')"
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "Tag v$VERSION does not match versionName $DECLARED in app/build.gradle.kts" >&2
            exit 1
          fi

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is empty" >&2
            exit 1
          fi
          # Runner temp dir, not the repo root: never clobber a dev key,
          # and it is wiped with the runner.
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_TEMP_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Universal APK only (no per-ABI splits, no AAB): one artifact for
      # sideloading and GitHub Releases. Revisit if Play publishing is needed.
      - name: Signed release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_TEMP_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "super-sudoku-${TAG}.apk"

      - name: Build release notes from CHANGELOG
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($0 ~ "^## " ver "([ -]|$)") found=1; next }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Super Sudoku $VERSION" > release_notes.md
          fi
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            super-sudoku-*.apk
          body_path: release_notes.md
