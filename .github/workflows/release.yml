name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        # NOTE: see ci.yml — package names must be UNQUOTED, and omitting
        # `packages` falls back to the long-removed `tools` package.
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: "false"

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "super-sudoku-${TAG}.apk"

      - name: Publish GitHub Release
        # NOTE: explicit body, never generate_release_notes — the generated
        # "Full Changelog" footer gets duplicated every time a tag is
        # force-pushed and the existing release is updated.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            super-sudoku-*.apk
          body: |
            Super Sudoku ${{ github.ref_name }}

            Sideload-friendly build signed with the debug key — install it
            directly on your device. (Play Store builds are signed separately
            with the private upload key.)
