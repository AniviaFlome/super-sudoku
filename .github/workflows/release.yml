name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        # NOTE: pass packages to sdkmanager directly — the action's
        # `packages:` input keeps literal quotes and breaks ("platforms;android-36" not found).
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Unsigned release AAB + debug APK
        run: ./gradlew :app:bundleRelease :app:assembleDebug --no-daemon

      - name: Rename artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/bundle/release/app-release.aab "super-sudoku-${TAG}.aab"
          cp app/build/outputs/apk/debug/app-debug.apk "super-sudoku-${TAG}.apk"
          sha256sum "super-sudoku-${TAG}.aab" "super-sudoku-${TAG}.apk" > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            super-sudoku-*.aab
            super-sudoku-*.apk
            checksums.txt
          generate_release_notes: true
