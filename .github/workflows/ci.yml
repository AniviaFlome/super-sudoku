name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        # NOTE: package names must be UNQUOTED here — the action splits the
        # string naively and literal quotes break sdkmanager. Omitting
        # `packages` is worse: it defaults to the obsolete `tools` package,
        # which no longer exists in the repository.
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: "false"

      - name: Core unit tests
        run: ./gradlew :core:test --no-daemon

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Unsigned release bundle (compile check)
        run: ./gradlew :app:bundleRelease --no-daemon
